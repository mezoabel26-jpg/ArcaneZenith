name: Build Arcane Zenith Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - run: chmod +x gradlew

      - name: Build mod
        run: ./gradlew build --no-daemon
        env:
          GRADLE_OPTS: "-Xmx3G"

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: arcanezenith-mod
          path: build/libs/*.jar
          retention-days: 30
